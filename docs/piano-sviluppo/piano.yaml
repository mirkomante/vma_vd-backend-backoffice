      supportati da Next.js con static export puro (output:'export') —
      richiedono un runtime Node per-request. Questo vincolo esclude lo
      static export come modalità di compilazione per i due siti CMS e
      restringe la scelta a SSR pieno o ISR selettivo, risolta in
      fase-4.4 con ISR on-demand.
    adr: "ADR — Strategia di rendering e comunicazione con i siti esterni"
    fonte: "riepilogo-sessione-preview-e-aree-gestione.md §1 (aggiornamento 2026-09-12), riepilogo-sessione-bucket-d.md §5"

