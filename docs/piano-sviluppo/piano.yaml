# ============================================================================
# piano.yaml — DAG di progetto
# Backend/backoffice PayloadCMS per vietnamonamour.com, villadoree.com,
# menu.vietnamonamour.com
# ============================================================================
# Costruito secondo 00-come-eseguire-il-piano.md, Passo 0.2, a partire da:
#   - Passo 0.1 (decisioni di variante), chiuso 2026-09-13
#   - i dieci riepiloghi di sessione già in project knowledge
#   - punti-aperti-bucket-a-d.md, riepilogo-sessione-bucket-c.md,
#     riepilogo-sessione-bucket-d.md
#
# Convenzioni:
#   - ogni nodo in "fasi" è una fase o sottofase; id "fase-N" o "fase-N.M"
#   - ogni arco in "archi" è tipizzato "output" oppure "decisione"
#   - un arco "decisione" porta un riferimento "adr" (titolo dell'ADR da
#     scrivere subito dopo, secondo ADR-template.md); un arco "output" non
#     lo richiede (adr: null)
#   - stato di ciascun nodo: "da_fare" | "in_corso" | "fatto" | "bloccata" | "fuori_perimetro"
#     (bloccata: dipendenza esterna non ancora risolta; fuori_perimetro:
#     sviluppato in un altro progetto, non eseguito da questo piano)
#   - la numerazione fase-4/5/6/7 è assegnata QUI per la prima volta (il
#     dominio applicativo non ha un ordine fissato dal catalogo) — da
#     riportare nei file fase-N-<area>.md quando verranno scritti (vedi
#     tracciamento-processo-adr-dag.md, punto 5)
#   - questo file va salvato come docs/piano-sviluppo/piano.yaml al Passo 1
#     (tracciamento-processo-adr-dag.md, punto 4)
# ============================================================================

meta:
  progetto: "Backend PayloadCMS — Vietnam Mon Amour & Villa Dorée"
  data_costruzione: "2026-09-13"
  varianti_adottate:
    provider_auth: "google-oauth"
    provider_email: "resend"
    database: "postgres"
    ambiente_cloud: "gcp"
    package_manager: "pnpm"       # fisso, non variante
    ui_kit: "shadcn/ui"           # fisso, non variante
  # L'ordine di esecuzione non coincide con la numerazione delle fasi.
  # Priorità decisa il 2026-10-03: portare a compimento prima il menù digitale
  # (parte CMS, API e backoffice; il frontend pubblico è fuori perimetro).
  ordine_esecuzione:
    - "fase-4.0 (localizzazione e lingua d'interfaccia)"
    - "fase-7 (impostazioni-sistema: orari e chiusure sono fonte unica per menù e prenotazioni)"
    - "fase-8 (shell (app) + shadcn/ui)"
    - "fase-6 (menù digitale; 6.7 fuori perimetro; solo 6.5 parte B dipende dal frontend esterno)"
    - "poi fase-4.1/4.2/4.3-A/4.4-A, quindi fase-5"
  vincoli_hard:
    - "Payload >= 3.73.0 — CVE-2026-25544 (SQL injection su adapter Drizzle-based: Postgres/SQLite)"
    - "defaultLocale del progetto Payload è unico per l'intero progetto ('it') — riguarda solo l'interfaccia admin/app, non la lingua dei contenuti dei siti: quella è determinata dal parametro locale esplicito in ogni richiesta REST (vedi arco-01)"
  principio_trasversale:
    - "CI/CD sempre su Cloud Build — GitHub Actions escluso in ogni scenario. GitHub resta solo hosting del codice sorgente (Cloud Source Repositories non disponibile per nuovi clienti dal giugno 2024)."

# ============================================================================
# NODI
# ============================================================================

fasi:

  # --------------------------------------------------------------------------
  # Fase 1-3: ereditate dal catalogo cursor-payload-template, invariate salvo
  # selezione varianti (Passo 0.1, già chiuso). Nessun nuovo ADR di progetto
  # per la selezione delle varianti stesse: si eredita l'invariante di
  # catalogo (vedi 00-come-eseguire-il-piano.md, "ADR di catalogo vs ADR di
  # progetto").
  # --------------------------------------------------------------------------

  - id: fase-1
    nome: "Setup"
    origine: catalogo
    file: "fase-1-setup.md"
    varianti:
      - "fase-1-db-postgres.md"
    stato: "fatto"

  - id: fase-2
    nome: "Login"
    origine: catalogo
    file: "fase-2-login.md"
    varianti:
      - "fase-2-auth-google-oauth.md"
      - "fase-2-email-resend.md"
    stato: "fatto"
    note: >
      Include lo schema ruoli baseline (adminRole/appRole, ADR-001 di
      catalogo, ereditato senza deviazione — riepilogo-sessione-bucket-d.md
      §3) e l'allow-list per dominio Google Workspace già esistente per lo
      staff (Passo 0.1).

  - id: fase-3
    nome: "Deploy"
    origine: catalogo
    file: "fase-3-deploy.md"
    varianti:
      - "fase-3-db-postgres.md"
      - "fase-3-cloud-gcp.md"
      - "fase-3-auth-google-oauth.md"
    stato: "fatto"
    note: "Chiusura Fase 3 § 3.5 (2026-10-03). Lacuna prod documentata: login locale App + email attivazione non rieseguiti (§ 3.3, dev § 2.10)."

  # --------------------------------------------------------------------------
  # Fase 4+: dominio applicativo di questo progetto, esplicitamente fuori dal
  # template (vedi tracciamento-processo-adr-dag.md, punto 5).
  # --------------------------------------------------------------------------

  - id: fase-4
    nome: "CMS siti esterni (vietnamonamour.com + villadoree.com)"
    origine: dominio-applicativo
    file: "fase-4-cms-siti-esterni.md"
    stato: "da_fare"
    note: >
      Fase definita il 2026-10-03. Questo progetto contiene solo i contenuti
      dei due siti (Payload su Cloud Run); i due siti sono applicazioni
      separate, in un altro progetto, non ancora sviluppate, ciascuna su un
      proprio progetto Firebase Hosting distinto. Parti rimandate fino a
      frontend/design disponibili: fase-4.5, fase-4.6 e le parti "lato siti"
      di fase-4.3 e fase-4.4 (condizioni di sblocco in fase-4-cms-siti-esterni.md).
    sottofasi:
      - id: fase-4.0
        nome: "Localizzazione nativa Payload (recupero della deviazione da fase-1)"
        stato: "fatto"
        note: "Prerequisito di fase-4.1. ADR-103 §3 e arco-01 la richiedevano già in fase-1; assente nel codice alla chiusura di fase-3 (verificato 2026-10-03). Eseguita il 2026-10-03 (commit 62cdde8): localization it/en, i18n solo italiano, migrazione localization_enum."
      - id: fase-4.1
        nome: "Scaffolding Collection pages + Global sito (impostazioni-vma, impostazioni-villadoree)"
        stato: "da_fare"
        note: "Dipende da fase-4.0 e da fase-8.3 (valore manager di adminRole, ADR-113, arco-33). Non dipende dal design. riepilogo-sessione-cms-siti-esterni.md §1/§2/§6"
      - id: fase-4.2
        nome: "Plugin di supporto (SEO, Redirects)"
        stato: "da_fare"
        note: "La parte i18n è in fase-4.0. Aperti: due siti con una sola collection redirects del plugin; storage dei media. riepilogo-sessione-cms-siti-esterni.md §3"
      - id: fase-4.3
        nome: "Meccanismo di preview (Draft Mode + route /api/preview + token firmato)"
        stato: "da_fare"
        note: "Parte A (lato CMS + contratto ADR-111) eseguibile dopo fase-4.1. Parte B (route /api/preview sui siti, Draft Mode, verifica end-to-end) rimandata: richiede i frontend dei siti. riepilogo-sessione-preview-e-aree-gestione.md §1"
      - id: fase-4.4
        nome: "Strategia di rendering (ISR on-demand) e comunicazione coi siti esterni"
        stato: "da_fare"
        note: "Parte A (hook afterChange di revalidation lato Payload, contratto ADR-111) eseguibile; Parte B (ISR e verifica end-to-end) rimandata fino ai frontend. Nessuna attività Firebase in questo progetto. riepilogo-sessione-bucket-d.md §2/§5"
      - id: fase-4.5
        nome: "Definizione dei Block del layout builder"
        stato: "bloccata"
        note: "Dipende dal design e dai frontend dei due siti (progetto separato), non ancora disponibili; richiede anche la decisione sullo storage dei media. riepilogo-sessione-cms-siti-esterni.md §6"
      - id: fase-4.6
        nome: "Content population + compilazione Redirects (from -> to)"
        stato: "bloccata"
        note: "Dipende da fase-4.5: le pagine devono esistere come record prima di poter essere target di un redirect interno. riepilogo-sessione-cms-siti-esterni.md §6/§7, riepilogo-sessione-bucket-c.md §4"

  - id: fase-5
    nome: "Sistema prenotazioni (vietnamonamour.com)"
    origine: dominio-applicativo
    file: "fase-5-sistema-prenotazioni.md (da scrivere)"
    stato: "da_fare"
    sottofasi:
      - id: fase-5.1
        nome: "Global 'Impostazioni prenotazioni' (servizi, capienza, chiusure annuali)"
        stato: "da_fare"
        note: "Nasce senza i tre campi orario/chiusura (ADR-109 §3). riepilogo-sessione-sistema-prenotazioni.md §5"
      - id: fase-5.2
        nome: "Collection 'Eccezioni giorno' + UI custom slot-chiusi (condivisa col form pubblico)"
        stato: "da_fare"
        note: "riepilogo-sessione-sistema-prenotazioni.md §5, riepilogo-sessione-bucket-c.md §1"
      - id: fase-5.3
        nome: "Collection 'Prenotazioni' (ciclo di vita a 5 stati, hook di controllo, anonimizzazione GDPR)"
        stato: "da_fare"
        note: "riepilogo-sessione-sistema-prenotazioni.md §4/§5, riepilogo-sessione-gdpr-prenotazioni.md"
      - id: fase-5.4
        nome: "Integrazione push Google Calendar"
        stato: "da_fare"
        note: "Credenziali/service account deferite all'implementazione. Deviazione esplicita rispetto alla scelta iniziale di evitare OAuth. riepilogo-sessione-bucket-c.md §2"
      - id: fase-5.5
        nome: "Backoffice (app) prenotazioni — shadcn/ui, mobile-first"
        stato: "da_fare"
        note: "Dipende da fase-8 (shell (app) + shadcn/ui)."
      - id: fase-5.6
        nome: "Form pubblico 'Prenota un tavolo' (innesto su fase-4.1)"
        stato: "da_fare"
        note: "riepilogo-sessione-cms-siti-esterni.md §4.1"

  - id: fase-6
    nome: "Menù digitale (menu.vietnamonamour.com)"
    origine: dominio-applicativo
    file: "fase-6-menu-digitale.md (da scrivere)"
    stato: "da_fare"
    note: >
      Priorità del progetto (2026-10-03): completa e funzionante per prima,
      per la parte CMS, API e backoffice. Il frontend pubblico (6.7) è un'app
      Firebase in un altro progetto. Si esegue dopo fase-7 e fase-8.
    sottofasi:
      - id: fase-6.1
        nome: "Tassonomie (Categoria piatto, Allergeni, Paese/Regione/Denominazione/Classificazione, Tipologia distillato) + permessi manager/admin"
        stato: "da_fare"
        note: "Scaffolda anche il Global 'Generali' senza i campi orario/chiusura (ADR-109 §2/§4): gli orari si leggono da impostazioni-sistema (fase-7.2). riepilogo-sessione-criterio-manager-admin-menu.md §2/§3"
      - id: fase-6.2
        nome: "Collection Piatti / Vini / Birra + menu_fisso_piatto (campo porzione) + Servizi (emendamento ad ADR-108)"
        stato: "da_fare"
        note: "Prerequisiti: contratto ADR-112 e decisione po-09 (menù bilingue). po-05 chiuso: l'import dei dati esistenti è in fase-6.8. Scaffolda anche la Collection Servizi (emendamento ad ADR-108, 2026-10-04). riepilogo-sessione-requisiti-architettura-menu-digitale.md §2, riepilogo-sessione-varianti-porzione-piatto.md"
      - id: fase-6.3
        nome: "Collection 'Giorni Speciali'"
        stato: "da_fare"
        note: "riepilogo-sessione-requisiti-architettura-menu-digitale.md §2.1. I menu speciali attuali (San Valentino: menu fissi con pagina dedicata nel vecchio frontend) non si importano: si ricreano con questo meccanismo (decisione del 2026-10-04)."
      - id: fase-6.4
        nome: "Disponibilità (terminato/disabilitato) + Cloud Scheduler reset + disponibilita.json su GCS"
        stato: "da_fare"
        note: "Prerequisiti: Cloud Scheduler, bucket GCS e IAM da predisporre (arco-17, debito di fase-3); schema di disponibilita.json dal contratto ADR-112; confini di servizio letti da impostazioni-sistema (fase-7.2). riepilogo-sessione-requisiti-architettura-menu-digitale.md §2.6/§4.4"
      - id: fase-6.5
        nome: "Rebuild manuale del menù SSG via Cloud Build (pulsante backoffice)"
        stato: "da_fare"
        note: "Parte A (endpoint Payload, pulsante, IAM, trigger Cloud Build) eseguibile con uno step di prova che non fa deploy. Parte B (verifica end-to-end) dipende dal frontend del menù e da un progetto Firebase di test: è l'unica sottofase di fase-6 che dipende dal progetto esterno. riepilogo-sessione-bucket-d.md §2"
      - id: fase-6.6
        nome: "Backoffice (app) menù — shadcn/ui, mobile-first"
        stato: "da_fare"
        note: "Dipende da fase-8 (shell (app) + shadcn/ui) e da fase-6.2."
      - id: fase-6.7
        nome: "Frontend pubblico SSG + banner di stato unificato (isOpen/activeSlot/isHoliday)"
        stato: "fuori_perimetro"
        note: "Sviluppato in un altro progetto (app Firebase del menù): fuori dal perimetro di questo piano, confermato il 2026-10-03. Questo piano fornisce solo API di lettura e disponibilita.json secondo il contratto ADR-112. riepilogo-sessione-requisiti-architettura-menu-digitale.md §2.8/§4.3"
      - id: fase-6.8
        nome: "Import dei dati esistenti dal vecchio backend (script da snapshot JSON)"
        stato: "da_fare"
        note: "Decisione po-05 (2026-10-04), vedi emendamento ad ADR-108: report a secco, prova in sviluppo, produzione da locale. Dipende da fase-6.2. Procedura di esportazione dello snapshot: docs/operativo/export-menu-vtn-backend.md."

  - id: fase-7
    nome: "Global 'impostazioni-sistema' (configurazione tecnica trasversale)"
    origine: dominio-applicativo
    file: "fase-7-impostazioni-sistema.md"
    stato: "da_fare"
    note: >
      Sbloccata: la sessione dedicata alla struttura a tab si è tenuta
      (riepilogo-sessione-impostazioni-sistema.md) e le decisioni sono
      state chiuse in ADR-109-global-impostazioni-sistema.md (4 tab,
      campi per tab, riconciliazione con Global 'Generali' menù e
      'Impostazioni prenotazioni', permessi granulari). Resta "da_fare"
      come le altre fasi di dominio: il file fase-7-impostazioni-sistema.md
      è scritto e validato (2026-10-04). 7.1-7.3 non sono bloccate da decisioni
      mancanti; neanche 7.4: il punto sull'accesso del manager all'Admin è
      risolto da ADR-113 (accettata).
    sottofasi:
      - id: fase-7.1
        nome: "Struttura a tab e definizione campo-per-campo"
        stato: "da_fare"
        note: "Decisa in ADR-109 §1/§5 — questa sottofase implementa, non decide più."
      - id: fase-7.2
        nome: "Fonte unica orari/chiusure (riconciliazione Global 'Generali' menù <-> 'Impostazioni prenotazioni')"
        stato: "da_fare"
        note: "Riconciliazione decisa in ADR-109 §2 (amendment ad ADR-107 §1 incluso). Eseguita prima di fase-5.1 e fase-6.1 (arco-21/22 invertiti il 2026-10-03): i due Global nascono senza i campi orario. Estesa dal terzo emendamento ad ADR-109 (2026-10-04): gruppo bnb (check-in e check-out) di vietnamonamour.com."
      - id: fase-7.3
        nome: "Riferimenti tecnici (id Google Calendar, mittenti Resend array, contatti notifiche staff array, slot integrazioni future)"
        stato: "da_fare"
        note: "Campi decisi in ADR-109 §1 (tab 'Integrazioni future' e 'Comunicazioni'). po-01 chiuso: mittenti decisi nell'Emendamento a §1 di ADR-109 (env RESEND_FROM_* per le email di sistema; array 'mittenti-resend' per sito verso i clienti, senza fallback; sito vietnamonamour/villadoree, validazione per sito unico). Calendario e Comunicazioni restano senza consumatori fino a fase-5; nessun arco verso il consumatore delle email agli ospiti finché non è definito."
      - id: fase-7.4
        nome: "Permessi granulari campo-per-campo (admin e super-admin tutto; appRole manager solo Orari e chiusure)"
        stato: "da_fare"
        note: "Permessi decisi in ADR-113, che supera ADR-109 §5 sul manager nell'Admin. Nascondere il Global al manager nell'Admin si verifica in fase-8.3."

  - id: fase-8
    nome: "Shell dell'Area App (app) + shadcn/ui (infrastruttura condivisa del backoffice)"
    origine: dominio-applicativo
    file: "fase-8-shell-app.md"
    stato: "da_fare"
    note: >
      Aggiunta il 2026-10-03: nessuna sottofase di fase-5 o fase-6 creava la
      shell condivisa dal backoffice. Oggi esiste solo /app/login,
      canAccessSection è uno stub che restituisce false e shadcn/ui non è
      installato. Il numero non indica l'ordine di esecuzione (vedi
      meta.ordine_esecuzione). Struttura delle sottofasi confermata nel file di fase (validato, 2026-10-04).
    sottofasi:
      - id: fase-8.1
        nome: "Installazione e verifica di shadcn/ui (compatibilità con le versioni di Tailwind e Next in uso)"
        stato: "da_fare"
      - id: fase-8.2
        nome: "Layout (app) mobile-first e navigazione per sezione (menu, hours, reservations)"
        stato: "da_fare"
        note: "Dipende da fase-8.1 e da fase-8.3 (la navigazione usa canAccessSection, arco-38): ordine di esecuzione 8.1, 8.3, 8.2."
      - id: fase-8.3
        nome: "Ruoli e guardia di accesso: valore manager in adminRole (migrazione), canAccessSection a tre sezioni, admin.hidden per il manager"
        stato: "da_fare"
        note: "po-02 chiuso da ADR-113 (accettata): manager unico per menù, orari e prenotazioni; accesso all'App di admin e super-admin derivato da adminRole. Deroga a ADR-001 e ADR-004 di catalogo."
      - id: fase-8.4
        nome: "Email di account per gli utenti dell'Admin: reinvio dell'attivazione (login locale) ed email di account creato (SSO)"
        stato: "da_fare"
        note: "Requisito del 2026-10-04: pulsante «reinvia email di attivazione» nell'Admin per gli utenti con login locale non ancora attivati; email «account creato» con indicazioni generali per gli utenti SSO, una sola volta (campo accountCreatedEmailSentAt, con migrazione). Mittente: quello di sistema (env RESEND_FROM_*, primo emendamento di ADR-109). Dettagli nel file di fase."
      - id: fase-8.5
        nome: "Sezione Orari dell'App (orari e chiusure del ristorante, orari del B&B)"
        stato: "da_fare"
        note: "Legge e scrive impostazioni-sistema (tab Orari e chiusure) con la sessione del manager (ADR-113). Dipende da fase-8.2, fase-8.3 e dai campi di fase-7.2."
      - id: fase-8.6
        nome: "Verifica in produzione di login locale App ed email (attivazione, reset, account creato)"
        stato: "bloccata"
        note: "Rimandata dall'umano il 2026-10-04 a dopo lo sviluppo delle sezioni dell'App (fase-6.6, fase-8.5). Vincolo di po-03: da completare prima del primo accesso reale dei manager. Debito di fase-3.3 (login locale App ed email coperti solo in sviluppo, fase-2.10); RESEND_API_KEY risulta già montato su Cloud Run (conferma dell'umano, non verificata sul servizio)."

# ============================================================================
# ARCHI
# ============================================================================

archi:

  # --- Output "di catalogo", ereditati, nessun ADR di progetto -------------

  - id: arco-00a
    da: fase-1
    a: fase-2
    tipo: output
    descrizione: "Ambiente locale pronto (env, Postgres locale) — arco standard di catalogo."
    adr: null

  - id: arco-00b
    da: fase-2
    a: fase-3
    tipo: output
    descrizione: "Schema ruoli/login funzionante (adminRole/appRole) da promuovere in produzione."
    adr: null

  - id: arco-00c
    da: fase-1
    a: fase-3
    tipo: output
    descrizione: "Vincolo Payload >= 3.73.0 (CVE-2026-25544) fissato in setup si applica anche all'immagine di deploy in produzione."
    adr: null

  # --- Decisioni e output di progetto — dominio CMS -------------------------

  - id: arco-01
    da: fase-4.0
    a: fase-4.1
    tipo: decisione
    descrizione: >
      Localizzazione nativa Payload abilitata a livello di intero progetto
      (locales it/en, defaultLocale 'it', fallbackLocale bidirezionale
      it<->en) e campi testuali marcati localized:true FIN DA SUBITO, prima
      che fase-4.1 inserisca contenuti reali nelle Collection pages — evita
      il problema di migrazione dati di Payload sui campi già popolati.
      defaultLocale riguarda solo l'interfaccia (admin/app in italiano); la
      lingua di ciascun sito è determinata dal parametro locale esplicito
      obbligatorio in ogni richiesta REST (it per VMA, en per Villa Dorée
      in release 1). Nota 2026-10-03: l'ADR la prevedeva già in fase-1, ma
      la fase-1 è stata chiusa senza; l'arco parte quindi da fase-4.0
      (recupero della deviazione).
    adr: "ADR — Plugin di supporto CMS (SEO, Redirects, i18n)"
    fonte: "riepilogo-sessione-cms-siti-esterni.md §3.3, punti-aperti-bucket-a-d.md (Bucket A)"

  - id: arco-02
    da: fase-4.1
    a: fase-4.2
    tipo: decisione
    descrizione: >
      Collection 'pages' + Global sito scaffoldati in fase-4.1 sono
      precondizione per il plugin SEO (meta per pagina) e per il plugin
      Redirects (campo 'to' come relationship a pages).
    adr: "ADR — Plugin di supporto CMS (SEO, Redirects, i18n)"
    fonte: "riepilogo-sessione-cms-siti-esterni.md §3.1/§3.2"

  - id: arco-03
    da: fase-4.1
    a: fase-4.5
    tipo: decisione
    descrizione: >
      Modello contenuti scelto — Collection 'pages' flat (nessuna
      gerarchia nested-docs) con campo layout a Blocks, invece di
      rich-text libero monolitico — condiziona la forma della definizione
      dei Block quando arriverà il design: ogni Block corrisponde 1:1 a un
      componente visivo.
    adr: "ADR — Modello contenuti dei siti esterni"
    fonte: "riepilogo-sessione-cms-siti-esterni.md §1/§2/§6"

  - id: arco-04
    da: fase-4.1
    a: fase-4.3
    tipo: decisione
    descrizione: >
      Meccanismo di preview scelto — Draft Preview (route /api/preview con
      token firmato + Draft Mode Next.js), non Live Preview né replica
      interna — condiziona lo sviluppo della route sui due siti esterni e
